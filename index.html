<title>Deal Desk Command Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A0F1D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: control-room console. Sticky command bar, KPI scoreboard, one working view at a time (Today, Flow board, Ledger, Radar, Playbook, Impact). Every deal opens in a right-hand drawer. */
:root{
  --ink:#0A0F1D; --panel:#111A2C; --panel2:#17223A; --line:#223050; --line2:#33446C;
  --fg:#E9EEF8; --muted:#8E9AB6; --faint:#5F6C8B;
  --signal:#FF8A3D; --signal-ink:#1C0F05; --signal-soft:rgba(255,138,61,.14);
  --desk:#FF8A3D; --reviewer:#5AB8FF; --requestor:#B892FF;
  --fast:#6EE7D2; --complex:#DCE3F2; --exception:#FF9EC1;
  --ok:#3DDC97; --warn:#FFC857; --crit:#FF5C7A;
  --ok-soft:rgba(61,220,151,.13); --warn-soft:rgba(255,200,87,.14); --crit-soft:rgba(255,92,122,.15);
  --glow:rgba(90,184,255,.10);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;min-height:100vh;
  background:radial-gradient(1200px 500px at 85% -10%,var(--glow),transparent 60%),radial-gradient(900px 400px at -10% 0%,var(--signal-soft),transparent 55%),var(--ink);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(10,15,29,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;flex:none}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:24px;line-height:1;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--signal)}
.topact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:0 6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.4s infinite}
.qpill{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:4px 10px;color:var(--muted)}
.qpill b{color:var(--signal);font-weight:500}
.qpill.hot{border-color:var(--crit);color:var(--fg);background:var(--crit-soft)}
.scan{height:2px;background:linear-gradient(90deg,transparent,var(--signal),var(--reviewer),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:scan 5s linear infinite;opacity:.8}
@keyframes scan{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);padding:8px 14px;font-weight:600;font-size:13px;transition:transform .15s,background .15s,border-color .15s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--faint)}
.btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);box-shadow:0 6px 24px -8px var(--signal)}
.btn.primary:hover{box-shadow:0 10px 30px -8px var(--signal)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--crit);color:var(--crit);background:transparent}
.btn.danger.solid{background:var(--crit);color:var(--ink)}
.btn.big{padding:12px 18px;font-size:14px;width:100%;justify-content:center}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--reviewer);font-size:12px;padding:0;font-weight:500}
.link:hover{text-decoration:underline}
kbd{font-family:var(--f-mono);font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}

main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px dashed var(--line2);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px}
.banner b{color:var(--fg)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kpi{background:var(--panel);padding:16px 18px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.kpi .lab i.ok{background:var(--ok)} .kpi .lab i.warn{background:var(--warn)} .kpi .lab i.crit{background:var(--crit)}
.kpi .val{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .val small{font-size:.5em;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi:first-child .val{color:var(--signal)}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);position:relative;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tab .n.hot{color:var(--crit)}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--signal);transform:scaleX(0);transition:transform .25s}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tab:hover{color:var(--fg)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.board-wrap{overflow-x:auto;padding-bottom:8px;margin-inline:-4px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:10px;padding:4px;min-width:min-content}
.col{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:280px;min-width:0}
.col>header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.cname{display:block;font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.cdept{display:block;font-size:11px;color:var(--muted)}
.ccount{font-family:var(--f-mono);font-size:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:1px 9px}
.col.hot>header .ccount{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.cards{display:flex;flex-direction:column;gap:8px;padding:10px}
.empty{color:var(--faint);font-size:12px;text-align:center;margin:16px 0}
.card{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .2s;width:100%;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lane,transparent)}
.card:hover{transform:translateY(-2px);border-color:var(--signal);box-shadow:0 10px 24px -14px var(--signal)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.acct{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip.ok{color:var(--ok);border-color:rgba(61,220,151,.4);background:var(--ok-soft)}
.chip.warn{color:var(--warn);border-color:rgba(255,200,87,.45);background:var(--warn-soft)}
.chip.crit{color:var(--crit);border-color:rgba(255,92,122,.5);background:var(--crit-soft)}
.chip.mute{color:var(--muted);border-color:var(--line2)}
.chip.par{color:var(--reviewer);border-color:rgba(90,184,255,.45)}
.lane{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;border:1px solid;white-space:nowrap}
.lane.fast{color:var(--fast);border-color:rgba(110,231,210,.45)}
.lane.complex{color:var(--complex);border-color:rgba(220,227,242,.35)}
.lane.exception{color:var(--exception);border-color:rgba(255,158,193,.5);background:rgba(255,158,193,.08)}
.who{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.who::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.who.desk{color:var(--desk)} .who.reviewer{color:var(--reviewer)} .who.requestor{color:var(--requestor)}
.abar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.abar i{display:block;height:100%;background:var(--ok);border-radius:4px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:1/-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel h3{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.note{color:var(--muted);font-size:12px;margin:0}
.insight{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--signal-soft);border:1px solid rgba(255,138,61,.35);font-size:13px}
.insight b{color:var(--signal)}
.bignum{font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:.42em;color:var(--muted);font-weight:600;margin-left:4px}

.sbar{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;align-items:center;gap:10px;padding:5px 0}
.sl{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:14px;background:var(--panel2);border-radius:4px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,rgba(90,184,255,.55),var(--reviewer));transform-origin:left}
.track i.crit{background:linear-gradient(90deg,rgba(255,92,122,.5),var(--crit))}
.track i.sig{background:linear-gradient(90deg,rgba(255,138,61,.45),var(--signal))}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.75;border-radius:2px}
.sv{font-family:var(--f-mono);font-size:12px;text-align:right}
.axis{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-top:4px}
.axis span:nth-child(2){display:flex;justify-content:space-between}

.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--panel2)}
.stack i{display:block;transform-origin:left}
.stack i.desk{background:var(--desk)} .stack i.reviewer{background:var(--reviewer)} .stack i.requestor{background:var(--requestor)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.legend div{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend .big{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.legend .s{font-size:12px;color:var(--muted)}

.gauge{position:relative;height:12px;border-radius:999px;background:var(--panel2);margin:14px 0 6px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--crit),var(--warn) 40%,var(--ok) 70%);transform-origin:left}
.gauge b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.gscale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--faint)}

.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.next div{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px}
.next b{display:block;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px;line-height:1}
.next span{font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:6px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;text-align:left;width:100%;transition:border-color .15s}
button.li:hover{border-color:var(--signal)}
.li .t{min-width:0;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--muted);font-size:12px}
.rank{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:22px;color:var(--faint);width:26px;text-align:center}
.pbar{width:64px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--crit))}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
table.compact{min-width:420px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button:hover{color:var(--fg)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,.select{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;min-width:0;width:100%}
.filters .input{width:auto}
.input::placeholder{color:var(--faint)}
.input:focus,.select:focus{outline:none;border-color:var(--signal)}
.input.sm,.select.sm{padding:5px 8px;font-size:12px;border-radius:8px}

.segs{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.segs button{background:none;border:0;border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.segs.mini button{padding:3px 8px;font-size:11px}
.segs.dec button[aria-pressed="true"][data-id$=":yes"]{background:var(--ok)}
.segs.dec button[aria-pressed="true"][data-id$=":yesif"]{background:var(--warn)}
.segs.dec button[aria-pressed="true"][data-id$=":no"]{background:var(--crit)}

.weeks{display:grid;gap:6px;align-items:end;height:160px;padding-top:18px;border-bottom:1px solid var(--line2)}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.wk i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--signal),rgba(255,138,61,.35));transform-origin:bottom}
.wk i.cold{background:linear-gradient(180deg,var(--reviewer),rgba(90,184,255,.3))}
.wk i.zero{background:var(--line);height:2px!important}
.wk span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wlabels{display:grid;gap:6px;font-family:var(--f-mono);font-size:10px;color:var(--faint);margin-top:6px;text-align:center}

.report{font-family:var(--f-mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:14px;max-height:420px;overflow:auto;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.delta{font-family:var(--f-mono);font-size:11px;margin-left:4px}
.delta.good{color:var(--ok)} .delta.bad{color:var(--crit)}

.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.lib{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lib dl{margin:0;display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;font-size:12.5px}
.lib dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.lib dd{margin:0;overflow-wrap:anywhere}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:60;transform:translateX(104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.6)}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:26px;line-height:1.05;margin:2px 0 0;text-transform:uppercase;overflow-wrap:anywhere}
.dbody{overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.x{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.sec h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.factgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fact{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-weight:600;font-variant-numeric:tabular-nums}
.fact input{background:none;border:0;padding:0;font-weight:600;width:100%;font-variant-numeric:tabular-nums}
.fact input:focus{outline:none;color:var(--signal)}

.stepper{overflow-x:auto;padding:4px 2px 6px}
.stepper ol{list-style:none;margin:0;padding:0;display:flex;min-width:min-content}
.stepper li{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 0 64px;position:relative;font-size:11px;color:var(--faint);text-align:center}
.stepper li.par{flex-basis:110px}
.stepper li::before{content:"";position:absolute;top:8px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.cur::before{background:var(--signal)}
.stepper li i{width:18px;height:18px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);position:relative;z-index:1}
.stepper li.par i{width:30px;border-radius:9px}
.stepper li.done i{background:var(--signal);border-color:var(--signal)}
.stepper li.done{color:var(--muted)}
.stepper li.cur{color:var(--fg);font-weight:600}
.stepper li.cur i{border-color:var(--signal);background:var(--ink);box-shadow:0 0 0 4px var(--signal-soft);animation:ring 1.8s infinite}
@keyframes ring{50%{box-shadow:0 0 0 7px rgba(255,138,61,.05)}}

.actbox{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.trk{border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.trk.crit{border-color:rgba(255,92,122,.6)}
.trk.warn{border-color:rgba(255,200,87,.5)}
.slabar{height:6px;border-radius:6px;background:var(--line);position:relative;overflow:visible}
.slabar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.slabar i.ok{background:var(--ok)} .slabar i.warn{background:var(--warn)} .slabar i.crit{background:var(--crit)}
.slabar u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
.chase{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chase b{color:var(--fg)}
.guard{border:1px solid var(--crit);background:var(--crit-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.guard.info{border-color:var(--warn);background:var(--warn-soft)}
.guard ul{margin:0;padding-left:18px}
.dept{margin-bottom:12px}
.dept .dh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px;gap:8px}
.dept.cur .dh{color:var(--signal);font-weight:600}
.ap{border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.ap:hover{background:var(--panel2)}
.ap.st-yes .apl{color:var(--muted)}
.ap.st-no{border-color:rgba(255,92,122,.4);background:var(--crit-soft)}
.aprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.apl{flex:1 1 200px;min-width:0}
.apl small{display:block;font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.apl small.warn{color:var(--warn)}
.apf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chk{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:7px 8px;transition:background .12s}
.chk:hover{background:var(--panel2)}
.chk .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px;transition:all .15s}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .box::after{content:"";width:5px;height:9px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk .lt{flex:1;min-width:0}
.chk.on .lt{color:var(--muted)}
.chk small{display:block;font-size:11.5px;color:var(--faint)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px}
.tag button{background:none;border:0;color:var(--muted);padding:0 4px;font-size:14px;line-height:1}
.fb{font-size:12px;border-left:2px solid var(--fast);padding:4px 0 4px 10px;margin-top:6px;color:var(--muted)}
.fb b{color:var(--fg)}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline .input{flex:1 1 160px;width:auto}
.inline .select{width:auto}
textarea.input{min-height:72px;resize:vertical}
.timeline{display:flex;flex-direction:column;font-size:13px}
.timeline div{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.timeline span:first-child{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line2);border:0;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-pressed="true"]{background:var(--signal)}
.sw.bad[aria-pressed="true"]{background:var(--crit)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}

form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.f .input,label.f .select{color:var(--fg);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

fieldset{border:1px solid var(--line2);border-radius:12px;padding:10px 10px 6px;margin:0;min-width:0}
legend{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.cb{display:flex;align-items:flex-start;gap:10px;padding:6px 4px;font-size:13px;cursor:pointer}
.cb input{width:17px;height:17px;accent-color:var(--signal);flex:none;margin-top:2px}
.cb small{display:block;color:var(--faint);font-size:11.5px}
.hint{font-size:12px;color:var(--faint);margin:-6px 0 0}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.route span{border:1px solid var(--line2);border-radius:999px;padding:2px 9px;background:var(--panel2)}
.route span.req{border-color:var(--signal);color:var(--signal)}
.route span.par{border-color:var(--reviewer);color:var(--reviewer)}
.route em{color:var(--faint);font-style:normal}
.preview{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.preview ul{margin:0;padding-left:18px;color:var(--muted)}
.preview ul b{color:var(--fg);font-weight:600}
.mtx{min-width:640px}
.mtx td{padding:6px 6px}
.mtx .input{padding:6px 8px;font-size:12.5px}
.mtx input[type=number]{width:70px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--fg);color:var(--ink);font-weight:600;font-size:13px;padding:8px 8px 8px 16px;border-radius:10px;z-index:80;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--ink);color:var(--fg);border:0;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600}
.toast button[hidden]{display:none}

.view.enter .card,.view.enter .panel,.view.enter .li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
.view.enter .track i,.view.enter .stack i,.view.enter .abar i,.view.enter .gauge i,.view.enter .pbar i{animation:grow .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:.15s}
.view.enter .wk i{animation:growy .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid,.grid3{grid-template-columns:minmax(0,1fr)}h1{font-size:20px}.live{display:none}.factgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:32px}.grid2{grid-template-columns:minmax(0,1fr)}.sbar,.axis{grid-template-columns:84px minmax(0,1fr) 54px}.legend .big{font-size:22px}.topact .btn.ghost .lbl{display:none}.apf{grid-template-columns:minmax(0,1fr)}}

<script>
(function(){
"use strict";
const DAY=864e5,HR=36e5;
const STAGES=[
  {id:'intake',short:'Intake',name:'Deal Request',dept:'Sales / PSS',always:true},
  {id:'psops',short:'PS Ops',name:'Operational Approvals',dept:'PS Sales Ops'},
  {id:'acs',short:'ACS',name:'Scoping & Pricing',dept:'ACS Pro Services'},
  {id:'legal',short:'Legal',name:'Contract Review',dept:'Legal'},
  {id:'credit',short:'Credit',name:'Payment & Billing',dept:'Credit'},
  {id:'ra',short:'Rev Assurance',name:'Revenue Compliance',dept:'Revenue Assurance',always:true},
  {id:'cops',short:'Contract Ops',name:'Signature & Filing',dept:'Contract Operations',always:true},
  {id:'om',short:'Order Mgmt',name:'Order Booking',dept:'Order Management',always:true},
  {id:'booked',short:'Booked',name:'Deal Booked',dept:'',always:true}
];
const SMAP=Object.fromEntries(STAGES.map(s=>[s.id,s]));
const WORK=STAGES.filter(s=>s.id!=='booked').map(s=>s.id);
const PAR=['acs','legal','credit'];
const TRIG={
  pricing:{label:'Non-standard pricing or discount',ap:[['psops','Pricing approval']]},
  travel:{label:'Customer travel policy',ap:[['psops','Customer travel policy approval']]},
  terms:{label:'Non-standard contract terms',ap:[['psops','Non-standard terms approval'],['legal','Legal review of non-standard terms']]},
  sow:{label:'PSD / SOW involved',ap:[['psops','PSD/SOW review & approval'],['acs','Project scope review'],['legal','PSD/SOW legal review']]},
  services:{label:'Professional services pricing',ap:[['acs','Service pricing validated'],['acs','Scope and pricing match the deal']]},
  payment:{label:'Non-standard payment terms',ap:[['credit','Payment terms approval']]},
  billing:{label:'Billing cycle change',ap:[['credit','Billing cycle change approval']]}
};
const ALWAYS=[['ra','Revenue impact reviewed & RA guidelines met'],['cops','Signatures routed, tracked & filed'],['om','Booking documentation validated']];
const INTAKE=[
  ['Commercial basics','Account, products, term length, deal value'],
  ['Customer ask','What is non-standard and why the customer needs it'],
  ['Scope & delivery','SOW or services scope, if any'],
  ['Economics','Quote, discount, payment and billing terms'],
  ['Context','Competition, close-date driver, deal stage'],
  ['Evidence','Quote file, redlines and customer emails attached to the opp']
];
const CLOSEOUT=['Final quote matches the approved pricing','Final contract matches the approved terms','Every "yes if" condition is met','Approval trail attached to the opportunity','Contract deviations logged','Renewal-impacting terms flagged to CS / AM','Approval expiration dates checked'];
const MISS=['Waiting on approver','Intake gaps / missing info','Customer changed the ask','Pricing rework','Redline back-and-forth','Desk capacity','Quarter-end volume','Other'];
const LANES={fast:{l:'Fast',d:'Inside guardrails'},complex:{l:'Complex',d:'Multiple levers, within risk appetite'},exception:{l:'Exception',d:'Guardrail breach or high risk'}};
const WHO={desk:'Desk',reviewer:'Reviewer',requestor:'Requestor'};
const COMMON_EXC=['Net 60 payment','Net 90 payment','Quarterly billing','Travel cap waived','Ramp pricing','Custom acceptance criteria','Custom SLA','Price hold','Termination for convenience'];
const LS='ddcc.v2';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const onClaude=/claude/i.test(location.hostname);

const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>!v?'$0':v>=1e6?'$'+(v/1e6).toFixed(v>=1e7?0:1)+'M':'$'+Math.round(v/1e3)+'K';
const dshort=t=>t?new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'—';
const days=ms=>ms/DAY;
const f1=n=>n==null||isNaN(n)?'—':n.toFixed(1);
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pctl=(a,p)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.ceil(p*s.length)-1)]};
const iso=t=>{if(!t)return'';const z=new Date(t);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const fromIso=s=>s?new Date(s+'T17:00:00').getTime():null;
function addMonths(d,n){const x=new Date(d);const day=x.getDate();const wasLast=day===new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(wasLast?last:Math.min(day,last));return x}
function defaultQEnd(){const d=new Date();const m=Math.floor(d.getMonth()/3)*3+2;return iso(new Date(d.getFullYear(),m+1,0).getTime())}

function defSettings(){
  const m=(approver,sla)=>({approver,backup:'',email:'',sla});
  return{myName:'Clinton',triageHrs:4,parallel:true,qEnd:defaultQEnd(),
    lanes:{fastDisc:10,excDisc:30,stdPay:30,excPay:90,mult:{fast:.5,complex:1,exception:1.5}},
    matrix:{intake:m('Deal Desk',1),psops:m('PS Sales Ops queue',2),acs:m('ACS Pro Services lead',2),legal:m('Commercial Legal',3),credit:m('Credit team',2),ra:m('Revenue Assurance',1),cops:m('Contract Ops',2),om:m('Order Management',1)}};
}
function mergeSettings(p){const d=defSettings();if(!p)return d;const o={...d,...p,lanes:{...d.lanes,...(p.lanes||{}),mult:{...d.lanes.mult,...((p.lanes||{}).mult||{})}},matrix:{...d.matrix}};WORK.forEach(s=>o.matrix[s]={...d.matrix[s],...((p.matrix||{})[s]||{})});return o}

/* ---------- State ---------- */
let state,canStore=true;
const S=()=>state.settings;
function load(){
  try{const s=localStorage.getItem(LS);if(s){const p=JSON.parse(s);if(p&&Array.isArray(p.deals)){state={deals:p.deals,library:p.library||[],settings:mergeSettings(p.settings)};return}}}catch(e){canStore=false}
  state={deals:[],library:[],settings:defSettings()};
  const smp=makeSample();state.deals=smp.deals;state.library=smp.library;
  state.settings.matrix.psops.backup='PS Ops manager';state.settings.matrix.legal.backup='Legal on-call';state.settings.matrix.credit.backup='Credit manager';
}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));canStore=true}catch(e){canStore=false}}
const ui={tab:'today',mode:null,id:null,guard:null,confirmDel:false,confirmClear:false,laneEdit:null,apOpen:null,escOpen:false,libId:null,sort:{k:'prio',dir:-1},q:'',stageF:'all',statusF:'active',laneF:'all',period:90,importRows:null};
const byId=id=>state.deals.find(d=>d.id===id);

/* ---------- Deal model ---------- */
const isBooked=d=>!!d.bookedAt;
function buildApprovals(trs){
  const list=[],seen=new Set();
  trs.forEach(t=>(TRIG[t]?.ap||[]).forEach(([dept,label])=>{const k=dept+'|'+label;if(!seen.has(k)){seen.add(k);list.push(newAp(dept,label))}}));
  ALWAYS.forEach(([dept,label])=>list.push(newAp(dept,label)));
  return list;
}
function newAp(dept,label){return{id:uid(),dept,label,status:'open',cond:'',exp:null,by:'',at:null}}
const cleared=a=>a.status==='yes'||a.status==='yesif';
const apprDone=d=>d.approvals.filter(cleared).length;
const openAppr=(d,st)=>d.approvals.filter(a=>a.dept===st&&!cleared(a));
function reqStages(d){const s=new Set(d.approvals.map(a=>a.dept));return STAGES.filter(x=>x.always||s.has(x.id)).map(x=>x.id)}
function steps(d){const r=reqStages(d),par=r.filter(s=>PAR.includes(s)),out=[];let placed=false;r.forEach(s=>{if(d.parallel&&par.length>=2&&PAR.includes(s)){if(!placed){out.push(par);placed=true}}else out.push([s])});return out}
const openSegs=d=>d.segs.filter(s=>!s.end);
function curStepIdx(d){const o=openSegs(d),st=steps(d);if(!o.length)return st.length-1;const i=st.findIndex(x=>x.includes(o[0].stage));return i<0?0:i}
const curStages=d=>openSegs(d).map(s=>s.stage);
const stageLabel=d=>isBooked(d)?'Booked':curStages(d).map(s=>SMAP[s].short).join(' + ');
const waiting=d=>isBooked(d)?null:(d.waitLog[d.waitLog.length-1]||{}).who;
function setWait(d,who,t){if(waiting(d)!==who)d.waitLog.push({who,at:t||now()})}
function reqOverlap(d,a,b){let o=0;const w=d.waitLog;for(let i=0;i<w.length;i++){if(w[i].who!=='requestor')continue;const s=w[i].at,e=i+1<w.length?w[i+1].at:(d.bookedAt||now());o+=Math.max(0,Math.min(b,e)-Math.max(a,s))}return o}
const activeMs=(d,a,b)=>Math.max(0,(b-a)-reqOverlap(d,a,b));
const segActive=(d,s)=>activeMs(d,s.start,s.end||now());
const slaFor=(d,st)=>Math.max(.25,(+S().matrix[st]?.sla||2)*(+S().lanes.mult[d.lane]||1));
const segRatio=(d,s)=>days(segActive(d,s))/slaFor(d,s.stage);
const ratio=d=>isBooked(d)?0:Math.max(0,...openSegs(d).map(s=>segRatio(d,s)));
const tone=r=>r>=1?'crit':r>=.75?'warn':'ok';
const clock0=d=>d.clockStart||null;
const cycleDays=d=>clock0(d)?days(activeMs(d,clock0(d),d.bookedAt||now())):null;
function stageDays(d){const o={};d.segs.forEach(s=>{if(s.stage==='booked')return;o[s.stage]=(o[s.stage]||0)+days(segActive(d,s))});return o}
function waitSplit(d){const o={desk:0,reviewer:0,requestor:0},w=d.waitLog,end=d.bookedAt||now();for(let i=0;i<w.length;i++){const e=i+1<w.length?w[i+1].at:end;o[w[i].who]+=Math.max(0,e-w[i].at)}return o}
const intakePct=d=>d.intake.filter(Boolean).length/INTAKE.length;
const escLevel=r=>r>=1?100:r>=.8?80:r>=.5?50:0;
function pendingEsc(d,s){const lv=escLevel(segRatio(d,s));if(!lv)return 0;return d.escal.some(e=>e.stage===s.stage&&e.level>=lv&&e.at>=s.start)?0:lv}
function expiring(d){if(isBooked(d))return[];return d.approvals.filter(a=>cleared(a)&&a.exp&&(a.exp<(d.closeDate||Infinity)||a.exp-now()<7*DAY))}

function autoLane(d){
  const L=S().lanes,t=d.triggers||[],disc=+d.discount||0,pay=+d.payDays||0;
  if(disc>L.excDisc||pay>L.excPay||t.includes('terms')||t.length>=4)return'exception';

/* medians (cached per render) */
let MED=null;
function meds(){if(MED)return MED;const per={};state.deals.forEach(d=>d.segs.forEach(s=>{if(s.end&&s.stage!=='booked')(per[s.stage]=per[s.stage]||[]).push(days(segActive(d,s)))}));MED={};WORK.forEach(s=>{const m=median(per[s]||[]);MED[s]=m!=null&&(per[s]||[]).length>=3?m:+S().matrix[s].sla});return MED}
function remaining(d){
  if(isBooked(d))return 0;const st=steps(d),i=curStepIdx(d),m=meds();
  let tot=Math.max(0,...openSegs(d).map(s=>Math.max(.25,m[s.stage]-days(segActive(d,s)))));
  for(let k=i+1;k<st.length;k++){if(st[k][0]==='booked')break;tot+=Math.max(...st[k].map(s=>m[s]))}

function closeRisk(d){if(isBooked(d)||!d.closeDate)return null;const left=days(d.closeDate-now()),rem=remaining(d);return{t:left<rem?'crit':left<rem+2?'warn':'ok',left,rem}}
function prio(d){
  const vmax=Math.max(1,...state.deals.filter(x=>!isBooked(x)).map(x=>x.value||0));
  const r=Math.min(1.5,ratio(d)),left=d.closeDate?days(d.closeDate-now()):60,urg=Math.max(0,Math.min(1,1-left/30)),cr=closeRisk(d);

function qeDelta(){const a=[],b=[];state.deals.filter(isBooked).forEach(d=>{const c=cycleDays(d);if(c!=null)(isQE(d.bookedAt)?a:b).push(c)});const ma=median(a),mb=median(b);return{ma,mb,na:a.length,nb:b.length,r:ma!=null&&mb?ma/mb:null}}

      discount:trs.includes('pricing')?Math.round(6+r()*30):Math.round(r()*8),payDays:trs.includes('payment')?(r()<.6?60:90+(r()<.3?30:0)):30,
      triggers:trs,approvals:[],intake:INTAKE.map(()=>true),segs:[],waitLog:[],exceptions:[],notes:'',kickback:false,overrides:[],misses:[],escal:[],sendbacks:[],laneLog:[],
      closeout:CLOSEOUT.map(()=>false),bookedAt:null,clockStart:null,ackAt:null,parallel:target==='booked'?i%2===0:true,laneAuto:true,sample:true};
    d.approvals=buildApprovals(trs);

    if(ti<0)ti=0;
    const lag=booked?(1+r()*110)*DAY:0;
    const bookAt=t0-lag;

    const durs=st.slice(0,ti).map(x=>{const o={};x.forEach(s=>o[s]=base[s]*mult[d.lane]*qe*(.45+r()*1.4)*DAY);return o});
    const stepLen=durs.map(o=>Math.max(...Object.values(o)));
    const curEl={};if(!booked)st[ti].forEach(s=>curEl[s]=(+defSettings().matrix[s].sla)*mult[d.lane]*(.25+r()*1.25)*DAY);
    const curLen=booked?0:Math.max(...Object.values(curEl));
    let t=(booked?bookAt:t0)-stepLen.reduce((a,b)=>a+b,0)-curLen;
    d.createdAt=t;d.ackAt=t+r()*5*HR;
    const incomplete=target==='intake'&&i===10;
    if(incomplete){d.intake=INTAKE.map((_,k)=>k!==2&&k!==5);d.ackAt=t+1.5*HR}
    if(target==='intake'&&i===11)d.ackAt=null;
    d.clockStart=incomplete?null:t;
    st.slice(0,ti+1).forEach((x,k)=>{
      if(x[0]==='booked'){d.segs.push({stage:'booked',start:t,end:t});d.bookedAt=t;return}
      const done=k<ti;
      x.forEach(s=>{
        const dur=done?durs[k][s]:curEl[s];
        const finished=done||(x.length>1&&r()<.45&&s!==x[0]);
        const seg={stage:s,start:t,end:finished?t+(done?dur:dur*.6):null};

      });

      d.waitLog.push({who:'desk',at:t});

      <h4 class="eyebrow" style="margin:16px 0 0">Target closes per week${over?` · ${over} already past date`:''}</h4>
      <div class="weeks" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${b.map((x,i)=>`<div class="wk"><span>${x.c||''}</span><i class="${x.c?'':'zero'}${i>=n-2?'':' cold'}" style="--i:${i};height:${x.c/mx*100}%"></i></div>`).join('')}</div>
      <div class="wlabels" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${b.map((x,i)=>`<span>${i%2&&n>6?'':dshort(x.s)}</span>`).join('')}</div>
    </div>
  </div>`;
}
function standupText(){
  const H=huddleData(),q=quarter(),d0=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const L=[`Deal Desk stand-up · ${d0}`,`Queue: ${H.A.length} active · ${H.A.filter(d=>ratio(d)>=1).length} past SLA · ${H.risk.filter(d=>closeRisk(d).t==='crit').length} likely to miss close`,'','Top priorities:'];
  H.ranked.slice(0,5).forEach((x,i)=>L.push(`${i+1}. ${x.d.code} ${x.d.account} (${money(x.d.value)}): ${stageLabel(x.d)}, waiting on ${(WHO[waiting(x.d)]||'').toLowerCase()}${x.d.closeDate?`, closes ${dshort(x.d.closeDate)}`:''}`));
  if(H.escs.length){L.push('','Escalations:');H.escs.slice(0,5).forEach(x=>L.push(`• ${x.d.code}: ${SMAP[x.s.stage].dept} at ${Math.round(segRatio(x.d,x.s)*100)}% of SLA, chasing ${S().matrix[x.s.stage].approver||'approver'}`))}
  if(H.blocked.length){L.push('','Blocked on reps:');H.blocked.forEach(x=>L.push(`• ${x.code} (${x.rep||'rep'}): ${INTAKE.filter((_,i)=>!x.intake[i]).map(z=>z[0]).join(', ')||'awaiting rep response'}`))}
  if(H.exp.length){L.push('','Expiring approvals:');H.exp.slice(0,5).forEach(x=>L.push(`• ${x.d.code}: ${x.a.label} expires ${dshort(x.a.exp)}`))}
  L.push('',`Quarter-end: ${q.left} days left · ${H.A.filter(d=>d.closeDate&&d.closeDate<=q.end).length} deals targeting this quarter`);

}

/* ---------- BOARD ---------- */

  }
  const w=waiting(d),tot=d.approvals.length,dn=apprDone(d),lv=pendingEsc(d,s),cr=closeRisk(d);

    <div class="row"><span class="code">${esc(d.code)} ${laneTag(d.lane)}</span>${slaChip(d,s)}</div>
    <div class="acct">${esc(d.account)}</div>
    <div class="row meta"><span class="num">${money(d.value)} · ${esc(d.rep||'—')}</span>${w?`<span class="who ${w}">${WHO[w]}</span>`:''}</div>
    <div class="abar"><i style="width:${tot?dn/tot*100:0}%"></i></div>
    <div class="chips">${openSegs(d).length>1?'<span class="chip par">∥ parallel</span>':''}${lv?`<span class="chip ${lv>=80?'crit':'warn'}">${lv===100?'Breached':'Escalate '+lv+'%'}</span>`:''}${cr&&cr.t!=='ok'?`<span class="chip ${cr.t}">Close ${dshort(d.closeDate)}</span>`:''}${!d.clockStart?'<span class="chip warn">Clock not started</span>':''}${expiring(d).length?'<span class="chip warn">Approval expiring</span>':''}</div>

function laneFilter(){return `<div class="segs">${[['all','All lanes'],['fast','Fast'],['complex','Complex'],['exception','Exception']].map(([v,l])=>`<button data-act="laneF" data-id="${v}" aria-pressed="${ui.laneF===v}">${l}</button>`).join('')}</div>`}
function viewBoard(){
  let k=0;const LF=d=>ui.laneF==='all'||d.lane===ui.laneF;
  const cols=STAGES.map(st=>{

/* ---------- LEDGER ---------- */
const SORTS={prio:d=>isBooked(d)?-1:prio(d),code:d=>d.code,account:d=>d.account.toLowerCase(),lane:d=>['fast','complex','exception'].indexOf(d.lane),rep:d=>(d.rep||'').toLowerCase(),value:d=>d.value||0,stage:d=>isBooked(d)?99:STAGES.findIndex(s=>s.id===curStages(d)[0]),wait:d=>waiting(d)||'',age:d=>isBooked(d)?-1:ratio(d),close:d=>d.closeDate||9e15,cycle:d=>cycleDays(d)??-1,appr:d=>apprDone(d)/Math.max(1,d.approvals.length)};

  const q=ui.q.trim().toLowerCase();

/* ---------- RADAR ---------- */
function viewRadar(){
  const D=state.deals,act=D.filter(d=>!isBooked(d)),bk=D.filter(isBooked);
  const per={};D.forEach(d=>Object.entries(stageDays(d)).forEach(([s,v])=>(per[s]=per[s]||[]).push(v)));
  const ss=STAGES.filter(s=>s.id!=='booked');
  const mm=ss.map(s=>({s,m:median(per[s.id]||[]),n:(per[s.id]||[]).length}));
  const mx=Math.max(1,...mm.map(x=>x.m||0),...ss.map(s=>+S().matrix[s.id].sla))*1.12;
  const worst=mm.filter(x=>x.m!=null).sort((a,b)=>b.m/S().matrix[b.s.id].sla-a.m/S().matrix[a.s.id].sla)[0];
  const bars=mm.map(x=>{const sl=+S().matrix[x.s.id].sla;return `<div class="sbar"><span class="sl">${x.s.short}</span><div class="track" title="Base SLA ${sl} days">${x.m!=null?`<i class="${x.m>sl?'crit':''}" style="width:${x.m/mx*100}%"></i>`:''}<b style="left:${sl/mx*100}%"></b></div><span class="sv">${x.m!=null?x.m.toFixed(1)+'d':'—'}</span></div>`}).join('');
  // lanes
  const laneRows=Object.keys(LANES).map(l=>{const b=bk.filter(d=>d.lane===l).map(cycleDays).filter(x=>x!=null);const a=act.filter(d=>d.lane===l);return `<tr><td>${laneTag(l)} <span class="note">${LANES[l].d}</span></td><td class="r num">${a.length}</td><td class="r num">${b.length}</td><td class="r num">${f1(median(b))}d</td><td class="r num">${f1(pctl(b,.9))}d</td><td class="r num">×${S().lanes.mult[l]}</td></tr>`}).join('');
  // wait split
  const ws={desk:0,reviewer:0,requestor:0};D.forEach(d=>{const w=waitSplit(d);for(const k in ws)ws[k]+=w[k]});
  const wt=ws.desk+ws.reviewer+ws.requestor||1;const top=Object.keys(ws).sort((a,b)=>ws[b]-ws[a])[0];
  const fe=flowEff(D);
  const advice={requestor:'Requestor wait is the biggest share. Hold the intake gate, use Send back, and coach the reps at the bottom of the scorecard.',reviewer:'Reviewer wait is the biggest share. Run Legal, Credit and ACS in parallel, chase at 50% of SLA, and escalate at 80%.',desk:'Desk time is the biggest share. Use the chase templates, batch similar approvals, and move recurring exceptions into the fallback library.'};
  // parallel
  const pd=bk.filter(d=>d.parallel&&d.segs.filter(s=>PAR.includes(s.stage)).length>=2),sq=bk.filter(d=>!d.parallel||d.segs.filter(s=>PAR.includes(s.stage)).length<2);
  const saved=D.reduce((a,d)=>a+parSaved(d),0);
  const multiRev=sq.filter(d=>new Set(d.segs.filter(s=>PAR.includes(s.stage)).map(s=>s.stage)).size>=2);
  // misses
  const mc={};D.forEach(d=>d.misses.forEach(m=>{const k=m.reason||'Not recorded';mc[k]=(mc[k]||0)+1}));
  const ml=Object.entries(mc).sort((a,b)=>b[1]-a[1]);const mt=ml.reduce((a,x)=>a+x[1],0);const mmx=Math.max(1,...ml.map(x=>x[1]));let cum=0;
  const pareto=ml.map(([k,v])=>{cum+=v;return `<div class="sbar"><span class="sl" title="${esc(k)}">${esc(k)}</span><div class="track"><i class="sig" style="width:${v/mmx*100}%"></i></div><span class="sv">${v} · ${Math.round(cum/mt*100)}%</span></div>`}).join('');
  // qe
  const Q=qeDelta();
  // next
  const nextC={};act.forEach(d=>{const st=steps(d),i=curStepIdx(d);(st[i+1]||[]).forEach(s=>{if(s!=='booked')nextC[s]=(nextC[s]||0)+1})});
  // reps
  const reps={};D.forEach(d=>{const k=d.rep||'Unassigned';const r=reps[k]=reps[k]||{n:0,ic:0,rq:0,kb:0,sb:0};r.n++;r.ic+=intakePct(d);r.rq+=days(waitSplit(d).requestor);r.sb+=d.sendbacks.length;if(d.kickback)r.kb++});
  const repRows=Object.entries(reps).map(([k,r])=>({k,n:r.n,ic:r.ic/r.n*100,rq:r.rq/r.n,kb:r.kb,sb:r.sb})).sort((a,b)=>a.ic-b.ic||b.sb-a.sb);
  return `<div class="grid">
    <div class="panel span2" style="--i:0"><div class="ph"><h3>Median days in each stage</h3><p class="note">White marker is the base SLA. Red runs past it. Time waiting on the rep is excluded.</p></div>
      ${bars}<div class="axis"><span></span><span><span>0d</span><span>${(mx/2).toFixed(1)}d</span><span>${mx.toFixed(1)}d</span></span><span></span></div>
      ${worst?`<div class="insight"><b>${worst.s.short}</b> is the tightest constraint at ${worst.m.toFixed(1)} days against a ${S().matrix[worst.s.id].sla}-day SLA. Fixing this stage moves total cycle time more than anything else.</div>`:''}

      <div class="tablewrap" style="border:0;background:none"><table class="compact"><thead><tr><th>Lane</th><th class="r">Active</th><th class="r">Booked</th><th class="r">Median</th><th class="r">Slowest 10%</th><th class="r">SLA scale</th></tr></thead><tbody>${laneRows}</tbody></table></div>
    </div>
    <div class="panel" style="--i:2"><div class="ph"><h3>Where the clock goes</h3><p class="note">All tracked time, by who held the deal</p></div>
      <div class="stack">${['desk','reviewer','requestor'].map(k=>`<i class="${k}" style="flex:${ws[k]/wt}"></i>`).join('')}</div>
      <div class="legend">${['desk','reviewer','requestor'].map(k=>`<div><span class="who ${k}">${WHO[k]}</span><span class="big">${Math.round(ws[k]/wt*100)}%</span><span class="s">${days(ws[k]).toFixed(0)} days total</span></div>`).join('')}</div>
      <div class="insight">${advice[top]}</div>
    </div>
    <div class="panel" style="--i:3"><div class="ph"><h3>Flow efficiency</h3><p class="note">Desk-held time ÷ total lead time</p></div>
      <div class="bignum">${V(fe,'pct')}</div>
      <div class="gauge"><i style="width:${Math.min(100,fe||0)}%"></i><b style="left:40%" title="40% target"></b></div>
      <div class="gscale"><span>0%</span><span>15% typical</span><span>40% strong</span><span>100%</span></div>
      <p class="note" style="margin-top:12px">Most teams run around 15%, so work waits about 85% of the time. Cutting wait time moves this faster than working faster.</p>
    </div>
    <div class="panel" style="--i:4"><div class="ph"><h3>Parallel review payoff</h3><p class="note">ACS, Legal and Credit at the same time</p></div>
      <div class="inline" style="gap:24px;align-items:flex-end"><div><div class="bignum" style="color:var(--reviewer)">${V(saved,'d1','days')}</div><span class="note">saved vs running in sequence</span></div><div><div class="bignum">${V(pd.length,'int')}</div><span class="note">booked deals ran parallel</span></div></div>
      <p class="note" style="margin-top:12px">Parallel deals median ${f1(median(pd.map(cycleDays).filter(x=>x!=null)))}d cycle · ${multiRev.length} booked deal${multiRev.length===1?'':'s'} ran multi-department review in sequence (median ${f1(median(multiRev.map(cycleDays).filter(x=>x!=null)))}d).</p>
    </div>
    <div class="panel" style="--i:5"><div class="ph"><h3>Quarter-end slowdown</h3><p class="note">Target: under 1.5×</p></div>

      <p class="note" style="margin-top:8px">Median cycle in the last 15 days of a quarter: <b style="color:var(--fg)">${f1(Q.ma)}d</b> (${Q.na} deals) vs mid-quarter <b style="color:var(--fg)">${f1(Q.mb)}d</b> (${Q.nb} deals).</p>
      ${Q.r!=null&&Q.r>=1.5?'<div class="insight">Quarter-end drags cycle time past the 1.5× line. Pre-clear the deals targeting quarter-end from the Today view, and give each department a volume heads-up two weeks out.</div>':''}
    </div>
    <div class="panel" style="--i:6"><div class="ph"><h3>Why SLAs get missed</h3><p class="note">Count · running share</p></div>
      ${pareto||'<p class="note">No missed SLAs logged yet. When a stage runs late, the reason you pick lands here.</p>'}

    </div>
    <div class="panel" style="--i:7"><div class="ph"><h3>Heading your way next</h3><p class="note">Active deals by the next department they need</p></div>
      <div class="next">${ss.filter(s=>s.id!=='intake').map(s=>`<div><b>${nextC[s.id]||0}</b><span>${s.short}</span></div>`).join('')}</div>

      ${repRows.map(r=>`<tr><td>${esc(r.k)}</td><td class="r num">${r.n}</td><td class="r"><span class="chip ${r.ic>=90?'ok':r.ic>=75?'warn':'crit'}">${Math.round(r.ic)}%</span></td><td class="r num">${r.sb}</td><td class="r num">${r.rq.toFixed(1)}d</td><td class="r num">${r.kb}</td></tr>`).join('')}

/* ---------- PLAYBOOK ---------- */
const libFor=name=>state.library.find(x=>x.name.toLowerCase()===String(name).toLowerCase());
function excGroups(){const g={};state.deals.forEach(d=>d.exceptions.forEach(t=>{const k=(libFor(t)||{}).name||t;(g[k]=g[k]||[]).push(d)}));return Object.entries(g).map(([tag,deals])=>({tag,deals})).sort((a,b)=>b.deals.length-a.deals.length)}
function viewPlaybook(){
  const G=excGroups(),bk=state.deals.filter(isBooked),avg=a=>{const c=a.map(cycleDays).filter(x=>x!=null);return c.length?c.reduce((s,x)=>s+x,0)/c.length:null};const avgAll=avg(bk);

/* ---------- IMPACT ---------- */
function periodData(p,offset=0){
  const end=now()-offset*p*DAY,start=p?end-p*DAY:0,inP=t=>t&&t>=start&&t<end;
  const bk=state.deals.filter(d=>inP(d.bookedAt));const cyc=bk.map(cycleDays).filter(x=>x!=null);
  const acked=state.deals.filter(d=>inP(d.createdAt)&&d.ackAt);
  return{bk,med:median(cyc),p90:pctl(cyc,.9),fp:bk.length?bk.filter(d=>!d.kickback).length/bk.length*100:null,val:bk.reduce((a,d)=>a+(d.value||0),0),
    appr:state.deals.reduce((a,d)=>a+d.approvals.filter(x=>cleared(x)&&inP(x.at)).length,0),
    ov:state.deals.reduce((a,d)=>a+d.overrides.filter(o=>inP(o.at)).length,0),
    exc:new Set(bk.flatMap(d=>d.exceptions)).size,fe:flowEff(bk),saved:bk.reduce((a,d)=>a+parSaved(d),0),
    esc:state.deals.reduce((a,d)=>a+d.escal.filter(e=>inP(e.at)).length,0),
    tri:acked.length?acked.filter(d=>(d.ackAt-d.createdAt)/HR<=S().triageHrs).length/acked.length*100:null,
    lanes:Object.fromEntries(Object.keys(LANES).map(l=>[l,median(bk.filter(d=>d.lane===l).map(cycleDays).filter(x=>x!=null))]))};
}
function impactText(p){
  const cur=periodData(p),prev=p?periodData(p,1):null,lab=p?`last ${p} days`:'all time',Q=qeDelta(),std=state.library.filter(x=>x.standard),cands=excGroups().filter(g=>g.deals.length>=3&&!(libFor(g.tag)||{}).standard);
  return [
    `DEAL DESK IMPACT · ${lab.toUpperCase()}`,'',
    `• Booked ${cur.bk.length} deal${cur.bk.length===1?'':'s'} worth ${money(cur.val)}.`,
    cur.med!=null?`• Median request-to-booking cycle: ${cur.med.toFixed(1)} days${prev&&prev.med!=null?` (${cur.med<prev.med?'down':'up'} ${Math.abs((cur.med-prev.med)/prev.med*100).toFixed(0)}% vs the prior ${p} days)`:''}. Slowest 10%: ${cur.p90.toFixed(1)}+ days.`:null,
    Object.values(cur.lanes).some(x=>x!=null)?`• By lane: ${Object.entries(cur.lanes).filter(x=>x[1]!=null).map(([l,v])=>`${LANES[l].l} ${v.toFixed(1)}d`).join(' · ')}.`:null,
    cur.fp!=null?`• First-pass booking rate: ${Math.round(cur.fp)}% of deals booked by Order Management with no kickback.`:null,
    cur.fe!=null?`• Flow efficiency: ${Math.round(cur.fe)}% of lead time held by the desk (typical teams run about 15%).`:null,
    cur.saved>0?`• Parallel ACS / Legal / Credit review saved ${cur.saved.toFixed(1)} days versus running reviews in sequence.`:null,
    cur.tri!=null?`• Acknowledged ${Math.round(cur.tri)}% of new requests within the ${S().triageHrs}-hour triage SLA.`:null,
    `• Cleared ${cur.appr} required approval${cur.appr===1?'':'s'} across PS Sales Ops, ACS, Legal, Credit, Revenue Assurance, Contract Ops and Order Mgmt.`,
    `• Approvals bypassed: ${cur.ov}${cur.ov?' (each logged with a documented reason)':''}.`,
    cur.esc?`• Ran ${cur.esc} structured escalation${cur.esc===1?'':'s'} at the 50% / 80% SLA points.`:null,
    Q.r!=null?`• Quarter-end cycle time ran ${Q.r.toFixed(1)}× the mid-quarter median (target under 1.5×).`:null,
    std.length?`• Standardized ${std.length} recurring exception${std.length>1?'s':''} into pre-approved options: ${std.map(x=>x.name).join(', ')}.`:null,
    cands.length?`• Flagged ${cands.length} more for standardization: ${cands.map(g=>g.tag).join(', ')}.`:null
  ].filter(x=>x!==null).join('\n');
}
function viewImpact(){
  const p=ui.period,cur=periodData(p),prev=p?periodData(p,1):null;
  const dlt=(a,b,lowerBetter)=>{if(a==null||b==null||!b)return'';const ch=(a-b)/b*100;const good=lowerBetter?ch<0:ch>0;return `<span class="delta ${good?'good':'bad'}">${ch>0?'▲':'▼'}${Math.abs(ch).toFixed(0)}%</span>`};
  const t0=now(),wk=[...Array(12)].map((_,i)=>{const e=t0-(11-i)*7*DAY,s=e-7*DAY;const b=state.deals.filter(d=>d.bookedAt&&d.bookedAt>=s&&d.bookedAt<e);return{s,n:b.length,v:b.reduce((a,d)=>a+(d.value||0),0)}});
  const wm=Math.max(1,...wk.map(w=>w.n));
  return `<div class="grid">
    <div class="panel span2" style="--i:0"><div class="ph"><h3>Your impact</h3><div class="segs">${[[30,'30 days'],[90,'90 days'],[180,'6 months'],[0,'All time']].map(([v,l])=>`<button data-act="period" data-id="${v}" aria-pressed="${ui.period===v}">${l}</button>`).join('')}</div></div>
      <div class="tiles">
        <div class="tile"><b>${V(cur.bk.length,'int')}</b><span>Deals booked ${prev?dlt(cur.bk.length,prev.bk.length,false):''}</span></div>
        <div class="tile"><b>${V(cur.val,'money')}</b><span>Value booked ${prev?dlt(cur.val,prev.val,false):''}</span></div>
        <div class="tile"><b>${V(cur.med,'d1','d')}</b><span>Median cycle ${prev?dlt(cur.med,prev.med,true):''}</span></div>
        <div class="tile"><b>${V(cur.fp,'pct')}</b><span>First-pass booking</span></div>
        <div class="tile"><b>${V(cur.fe,'pct')}</b><span>Flow efficiency</span></div>
        <div class="tile"><b>${V(cur.saved,'d1','d')}</b><span>Saved by parallel review</span></div>
        <div class="tile"><b>${V(cur.tri,'pct')}</b><span>Triaged within ${S().triageHrs}h</span></div>
        <div class="tile"><b>${V(state.library.filter(x=>x.standard).length,'int')}</b><span>Exceptions standardized</span></div>
      </div>
      <h4 class="eyebrow" style="margin:6px 0 0">Deals booked per week · last 12 weeks</h4>
      <div class="weeks" style="grid-template-columns:repeat(12,minmax(0,1fr))">${wk.map((w,i)=>`<div class="wk" title="${w.n} booked · ${money(w.v)}"><span>${w.n||''}</span><i class="${w.n?'':'zero'}" style="--i:${i};height:${w.n/wm*100}%"></i></div>`).join('')}</div>
      <div class="wlabels" style="grid-template-columns:repeat(12,minmax(0,1fr))">${wk.map((w,i)=>`<span>${i%2?'':dshort(w.s)}</span>`).join('')}</div>
    </div>
    <div class="panel span2" style="--i:1"><div class="ph"><h3>Review-ready summary</h3><button class="btn sm primary" data-act="copyImpact">Copy summary</button></div>
      <pre class="report" id="report">${esc(impactText(p))}</pre>
      <p class="note" style="margin-top:10px">Paste this into a 1:1, a self-review, or a promotion case. Every number comes from the ledger.</p>
    </div>
  </div>`;
}

function trackHTML(d,s){
  const r=segRatio(d,s),lv=pendingEsc(d,s),sl=slaFor(d,s.stage),el=days(segActive(d,s)),paused=days((s.end||now())-s.start)-el;
  const oa=openAppr(d,s.stage),isIntake=s.stage==='intake';
  const gate=isIntake&&!d.intake.every(Boolean);
  let g='';
  if(ui.guard===s.stage){
    const n={bypass:oa.length>0,miss:r>1,closeout:s.stage==='om'&&!d.closeout.every(Boolean)};
    g=`<div class="guard">${n.bypass?`<div><b>${oa.length} approval${oa.length>1?'s are':' is'} still open in ${SMAP[s.stage].dept}:</b><ul>${oa.map(a=>`<li>${esc(a.label)}${a.status==='no'?' (declined)':''}</li>`).join('')}</ul><input class="input" id="g-bypass" placeholder="Why you're moving on anyway (gets logged)" style="margin-top:6px"></div>`:''}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
const COLMAP={code:['id','deal id','deal','code','dd'],account:['account','account name','opportunity','opp','opportunity name','customer'],rep:['rep','owner','opportunity owner','sales rep','ae'],value:['value','amount','acv','tcv','deal value'],closeDate:['close','close date','target close','closedate'],discount:['discount','discount %','disc'],payDays:['payment days','payment terms','net','terms']};
function mapCSV(text){
  const rows=parseCSV(text);if(rows.length<2)return null;
  const hdr=rows[0].map(h=>h.trim().toLowerCase());const idx={};
  Object.entries(COLMAP).forEach(([k,al])=>{const i=hdr.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
  if(idx.account==null&&idx.code==null)return{err:'Need at least an Account or Deal ID column.'};
  const out=rows.slice(1).map(r=>{const g=k=>idx[k]!=null?(r[idx[k]]||'').trim():'';const cd=g('closeDate');const ts=cd?(/^\d{4}-\d{2}-\d{2}$/.test(cd)?fromIso(cd):Date.parse(cd)):null;
    return{code:g('code'),account:g('account')||g('code'),rep:g('rep'),value:parseFloat(g('value').replace(/[$,]/g,''))||0,closeDate:isNaN(ts)?null:ts,discount:parseFloat(g('discount'))||0,payDays:parseInt(g('payDays').replace(/\D/g,''),10)||S().lanes.stdPay}}).filter(x=>x.account);
  return{rows:out,cols:Object.keys(idx)};
}
