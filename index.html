    ${R?(R.err?`<div class="guard">${esc(R.err)}</div>`:`<div class="preview"><b>${R.rows.length} deals found</b><span class="note">Matched columns: ${R.cols.join(', ')}</span><ul>${R.rows.slice(0,6).map(x=>`<li><b>${esc(x.account)}</b> ${esc(x.rep)} · ${money(x.value)}${x.closeDate?` · close ${dshort(x.closeDate)}`:''}</li>`).join('')}${R.rows.length>6?`<li>…and ${R.rows.length-6} more</li>`:''}</ul><button class="btn primary" data-act="csvImport">Import ${R.rows.length} deals</button></div>`):''}
  </div>`;
}
function csvOut(){
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const H=['Deal ID','Account','Rep','Lane','Value','Discount %','Payment days','Stage','Waiting on','SLA used %','Target close','Close risk','Cycle days','Approvals cleared','Approvals total','Exceptions','Bypasses','SLA misses','Escalations','Send-backs','Kicked back','Booked'];
  const rows=state.deals.map(d=>{const c=closeRisk(d);return[d.code,d.account,d.rep,LANES[d.lane].l,d.value,d.discount,d.payDays,stageLabel(d),WHO[waiting(d)]||'',isBooked(d)?'':Math.round(ratio(d)*100),iso(d.closeDate),c?(c.t==='crit'?'Likely miss':c.t==='warn'?'Tight':'On track'):'',cycleDays(d)==null?'':cycleDays(d).toFixed(1),apprDone(d),d.approvals.length,d.exceptions.join('; '),d.overrides.length,d.misses.length,d.escal.length,d.sendbacks.length,d.kickback?'Yes':'No',iso(d.bookedAt)]});
  return [H,...rows].map(r=>r.map(q).join(',')).join('\n');
}

/* ---------- Actions ---------- */
function newDeal(o){
  const t=now();const intake=o.intake||INTAKE.map(()=>false);const complete=intake.every(Boolean);
  const d={id:uid(),code:o.code||nextCode(),account:o.account,rep:o.rep||'',value:o.value||0,discount:o.discount||0,payDays:o.payDays||S().lanes.stdPay,closeDate:o.closeDate||null,triggers:o.triggers||[],parallel:o.parallel??S().parallel,
    approvals:buildApprovals(o.triggers||[]),intake,segs:[{stage:'intake',start:t,end:null}],waitLog:[{who:complete?'desk':'requestor',at:t}],exceptions:[],notes:o.notes||'',kickback:false,overrides:[],misses:[],escal:[],sendbacks:[],laneLog:[],closeout:CLOSEOUT.map(()=>false),
    bookedAt:null,createdAt:t,clockStart:complete?t:null,ackAt:o.ack?t:null,laneAuto:true};
  if(!d.triggers.includes('pricing')&&d.discount>S().lanes.fastDisc){d.triggers.push('pricing');d.approvals=buildApprovals(d.triggers)}
  if(!d.triggers.includes('payment')&&d.payDays>S().lanes.stdPay){d.triggers.push('payment');d.approvals=buildApprovals(d.triggers)}
  d.lane=autoLane(d);return d;
}
function relane(d,why){if(!d.laneAuto)return;const n=autoLane(d);if(n!==d.lane){d.laneLog.push({from:d.lane,to:n,reason:why||'Auto: deal terms changed',at:now()});d.lane=n}}
function completeTrack(d,stage,o){
  const t=now(),seg=openSegs(d).find(s=>s.stage===stage);if(!seg)return;
  const oa=openAppr(d,stage);if(oa.length)d.overrides.push({stage,count:oa.length,reason:o.bypass,at:t,kind:'approvals'});
  if(stage==='om'&&!d.closeout.every(Boolean))d.overrides.push({stage,count:d.closeout.filter(x=>!x).length,reason:o.closeout,at:t,kind:'closeout'});
  const r=segRatio(d,seg);if(r>1)d.misses.push({stage,reason:o.miss,at:t,over:days(segActive(d,seg))-slaFor(d,stage)});
  seg.end=t;if(stage==='intake'&&!d.ackAt)d.ackAt=t;
  if(openSegs(d).length)return `${SMAP[stage].short} complete. Waiting on the other reviews.`;
  const st=steps(d),i=st.findIndex(x=>x.includes(stage)),nx=st[i+1];
  if(!nx||nx[0]==='booked'){d.segs.push({stage:'booked',start:t,end:t});d.bookedAt=t;return `${d.code} booked in ${f1(cycleDays(d))} days`}
  nx.forEach(s=>d.segs.push({stage:s,start:t,end:null}));setWait(d,'reviewer',t);
  return `${d.code} moved to ${nx.map(s=>SMAP[s].short).join(' + ')}`;
}
function syncAfterApprovalChange(d){
  if(isBooked(d))return;const st=steps(d),i=curStepIdx(d),cur=st[i]||[];const t=now();
  cur.forEach(s=>{if(!d.segs.some(g=>g.stage===s&&!g.end)&&!d.segs.some(g=>g.stage===s&&g.end&&g.start>=Math.min(...openSegs(d).map(x=>x.start))))d.segs.push({stage:s,start:t,end:null})});
}
function chaseText(d,stage){
  const m=S().matrix[stage],s=openSegs(d).find(x=>x.stage===stage),oa=openAppr(d,stage);
  const by=new Date(now()+DAY).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  return [`Subject: ${d.code} · ${SMAP[stage].dept} review needed · ${d.account}${d.closeDate?` · close ${dshort(d.closeDate)}`:''}`,'',
    `Hi ${(m.approver||'team').split(' ')[0]},`,'',
    `${d.code} (${d.account}, ${money(d.value)}) is in ${SMAP[stage].dept} review${s?`, ${f1(days(segActive(d,s)))} of ${f1(slaFor(d,stage))} SLA days`:''}. Open items:`,
    ...(oa.length?oa.map(a=>`• ${a.label}`):['• Final confirmation']),
    '',`${d.closeDate?`Target close is ${dshort(d.closeDate)}. `:''}Can you confirm by ${by}?${m.backup?` If you're out, I'll route to ${m.backup}.`:''}`,'',`Thanks,`,`${S().myName||'Deal Desk'}`].join('\n');
}
function sendBackText(d){const miss=INTAKE.filter((_,i)=>!d.intake[i]);return [`Subject: ${d.code} · a few items needed before review starts`,'',`Hi ${(d.rep||'there').split(' ')[0].replace('.','')},`,'',`Thanks for submitting ${d.code} (${d.account}). Before it goes to review, I need:`,...miss.map(x=>`• ${x[0]}: ${x[1]}`),'',`The review clock starts as soon as these are in.`,'','Thanks,',S().myName||'Deal Desk'].join('\n')}
function proposalText(tag){const g=excGroups().find(x=>x.tag===tag);const bk=state.deals.filter(isBooked);const avg=a=>{const c=a.map(cycleDays).filter(x=>x!=null);return c.length?(c.reduce((s,x)=>s+x,0)/c.length).toFixed(1):'n/a'};const L=libFor(tag);
  return `Proposal: make "${tag}" a pre-approved deal option\n\nWhat I'm seeing: "${tag}" came up on ${g.deals.length} deals (${g.deals.map(d=>d.code).join(', ')}). Each one needed its own approval round.\nImpact: booked deals with this exception averaged ${avg(g.deals.filter(isBooked))} days from request to booking, vs ${avg(bk)} days across all booked deals.\n${L?`Proposed guardrail: ${L.fallback||'(define)'}\nStill escalate when: ${L.escalate||'(define)'}\n`:''}Ask: agree on standard guardrails for "${tag}" so deals that fit them skip the manual review.\nOwner: ${S().myName||'Deal Desk'}, Deal Desk`}
function download(name,text,type){try{const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('Download blocked. Use Copy CSV instead.')}}
function restoreFrom(txt){try{const p=JSON.parse(txt);if(!p||!Array.isArray(p.deals)||!p.deals.every(d=>Array.isArray(d.segs)))throw 0;snap();state={deals:p.deals,library:p.library||[],settings:mergeSettings(p.settings)};closeDrawer();save();renderAll(true);toast(`Restored ${p.deals.length} deals`,true)}catch(e){toast("That isn't a valid v2 backup. Paste the full text from Copy backup.")}}

const H={
  tab:id=>{ui.tab=id;renderTabs();renderView(true);window.scrollTo({top:0})},
  open:id=>openDrawer('deal',id),new:()=>openDrawer('new'),settings:()=>openDrawer('settings'),import:()=>openDrawer('import'),close:()=>closeDrawer(),
  undo:()=>undo(),
  complete:stage=>{const d=byId(ui.id),s=openSegs(d).find(x=>x.stage===stage);if(!s)return;if(openAppr(d,stage).length||segRatio(d,s)>1||(stage==='om'&&!d.closeout.every(Boolean))){ui.guard=stage;ui._keepScroll=true;renderDrawer();setTimeout(()=>{const g=document.querySelector('#g-bypass,#g-closeout,#g-miss');g&&g.focus()},30);return}let m;act(null,()=>{m=completeTrack(d,stage,{})});ui.guard=null;toast(m,true);renderDrawer()},
  guardGo:stage=>{const d=byId(ui.id),gv=id=>(document.getElementById(id)||{value:null}).value;const by=gv('g-bypass'),co=gv('g-closeout'),mi=gv('g-miss');
    if(by!==null&&!by.trim()){toast('Add a reason so the bypass is documented');return}if(co!==null&&!co.trim()){toast('Add a reason for booking before close-out is done');return}if(mi!==null&&!mi){toast('Pick why the SLA was missed');return}
    let m;ui.guard=null;act(null,()=>{m=completeTrack(d,stage,{bypass:by&&by.trim(),closeout:co&&co.trim(),miss:mi})});toast(m,true)},
  guardCancel:()=>{ui.guard=null;ui._keepScroll=true;renderDrawer()},
  unbook:()=>{const d=byId(ui.id);act(`${d.code} reopened at Order Mgmt`,()=>{d.segs=d.segs.filter(s=>s.stage!=='booked');const om=[...d.segs].reverse().find(s=>s.stage==='om');if(om)om.end=null;d.bookedAt=null;d.kickback=false})},
  wait:who=>{const d=byId(ui.id);ui._keepScroll=true;act(`Waiting on ${WHO[who].toLowerCase()}`,()=>setWait(d,who))},
  apSet:v=>{const[id,st]=v.split(':');const d=byId(ui.id),a=d.approvals.find(x=>x.id===id);ui._keepScroll=true;act(st==='yes'?'Approved':st==='yesif'?'Approved with conditions. Add the condition.':st==='no'?'Declined':'Reopened',()=>{a.status=st;a.at=st==='open'?null:now();if(st!=='open'&&!a.by)a.by=S().matrix[a.dept]?.approver||'';if(st==='yesif')ui.apOpen=a.id})},
  apOpen:id=>{ui.apOpen=ui.apOpen===id?null:id;ui._keepScroll=true;renderDrawer()},
  intake:i=>{const d=byId(ui.id);ui._keepScroll=true;act(null,()=>{d.intake[i]=!d.intake[i];if(d.intake.every(Boolean)){if(!d.clockStart)d.clockStart=now();if(waiting(d)==='requestor')setWait(d,'desk')}});if(d.intake.every(Boolean)&&d.clockStart&&now()-d.clockStart<2000)toast('Intake complete. Clock started.',true)},
  closeout:i=>{const d=byId(ui.id);ui._keepScroll=true;act(null,()=>{d.closeout[i]=!d.closeout[i]})},
  kick:()=>{const d=byId(ui.id);ui._keepScroll=true;act(null,()=>{d.kickback=!d.kickback});toast(d.kickback?'Kickback logged':'Kickback cleared',true)},
  ack:()=>{const d=byId(ui.id);ui._keepScroll=true;act(`Acknowledged in ${f1((now()-d.createdAt)/HR)}h`,()=>{d.ackAt=now()})},
  sendBack:()=>{const d=byId(ui.id);const txt=sendBackText(d);ui._keepScroll=true;act(null,()=>{d.sendbacks.push({at:now(),missing:INTAKE.filter((_,i)=>!d.intake[i]).map(x=>x[0])});setWait(d,'requestor');if(!d.ackAt)d.ackAt=now()});copy(txt,'Send-back message copied. Clock paused.')},
  chase:stage=>copy(chaseText(byId(ui.id),stage),'Chase email copied'),
  escToggle:()=>{ui.escOpen=!ui.escOpen;ui._keepScroll=true;renderDrawer()},
  escCopy:()=>{const d=byId(ui.id);const txt=escPackageText(d);logEsc(d);copy(txt,'Escalation package copied and logged')},
  escLog:()=>{logEsc(byId(ui.id));toast('Escalation logged',true)},
  laneSet:l=>{const d=byId(ui.id);if(l===d.lane)return;ui.laneEdit=l;ui._keepScroll=true;renderDrawer();setTimeout(()=>{const x=document.getElementById('laneReason');x&&x.focus()},30)},
  laneGo:()=>{const d=byId(ui.id),r=(document.getElementById('laneReason').value||'').trim();if(!r){toast('Add a reason for the lane change');return}const to=ui.laneEdit;ui.laneEdit=null;act(`Moved to ${LANES[to].l} lane`,()=>{d.laneLog.push({from:d.lane,to,reason:r,at:now()});d.lane=to;d.laneAuto=to===autoLane(d)})},
  laneCancel:()=>{ui.laneEdit=null;ui._keepScroll=true;renderDrawer()},
  parToggle:()=>{const d=byId(ui.id);ui._keepScroll=true;act(null,()=>{d.parallel=!d.parallel})},
  parDefault:()=>{act(null,()=>{S().parallel=!S().parallel})},
  excAdd:()=>{const v=(document.getElementById('excIn').value||'').trim();if(!v)return;const d=byId(ui.id);ui._keepScroll=true;act('Exception tagged',()=>{const L=libFor(v);const n=L?L.name:v;if(!d.exceptions.some(x=>x.toLowerCase()===n.toLowerCase()))d.exceptions.push(n)});setTimeout(()=>{const e=document.getElementById('excIn');e&&e.focus()},20)},
  excRemove:t=>{const d=byId(ui.id);ui._keepScroll=true;act(null,()=>{d.exceptions=d.exceptions.filter(x=>x!==t)})},
  addAppr:()=>{const l=(document.getElementById('newApprLabel').value||'').trim();if(!l){toast('Name the approval first');return}const d=byId(ui.id),dept=document.getElementById('newApprDept').value;ui._keepScroll=true;act('Approval added',()=>{d.approvals.push(newAp(dept,l));syncAfterApprovalChange(d)})},
  del:()=>{ui.confirmDel=true;ui._keepScroll=true;renderDrawer()},delCancel:()=>{ui.confirmDel=false;ui._keepScroll=true;renderDrawer()},
  delGo:()=>{const d=byId(ui.id);closeDrawer();act(`${d.code} deleted`,()=>{state.deals=state.deals.filter(x=>x.id!==d.id)})},
  sort:k=>{ui.sort=ui.sort.k===k?{k,dir:-ui.sort.dir}:{k,dir:['account','rep','code','stage','wait','close','lane'].includes(k)?1:-1};renderView(false)},
  statusF:s=>{ui.statusF=s;renderView(false)},laneF:l=>{ui.laneF=l;renderView(false)},
  period:p=>{ui.period=+p;renderView(true)},
  standup:()=>copy(standupText(),'Stand-up note copied'),
  copyImpact:()=>copy(document.getElementById('report').textContent,'Summary copied',document.getElementById('report')),
  proposal:tag=>copy(proposalText(tag),'Proposal copied. Paste it into an email or doc.'),
  libNew:name=>{ui.libId=null;ui.libName=name||'';openDrawer('lib')},
  libEdit:id=>{ui.libId=id;openDrawer('lib')},
  libDel:id=>{closeDrawer();act('Play deleted',()=>{state.library=state.library.filter(x=>x.id!==id)})},
  libCopy:id=>{const L=state.library.find(x=>x.id===id);copy(L.pushback||L.fallback||L.preferred||'','Pushback language copied')},
  clearSample:()=>act('Sample deals cleared',()=>{state.deals=state.deals.filter(d=>!d.sample);state.library=state.library.filter(x=>!x.sample)},true),
  loadSample:()=>act('Sample deals loaded',()=>{const s=makeSample();state.deals=state.deals.filter(d=>!d.sample).concat(s.deals);if(!state.library.length)state.library=s.library},true),
  backup:()=>copy(JSON.stringify(state),'Backup copied. Paste it somewhere safe.'),
  restore:()=>restoreFrom(document.getElementById('restoreTxt').value),
  clear:()=>{ui.confirmClear=true;renderDrawer()},clearCancel:()=>{ui.confirmClear=false;renderDrawer()},
  clearGo:()=>{ui.confirmClear=false;act('All deals removed',()=>{state.deals=[]},true)},
  csvCopy:()=>copy(csvOut(),'CSV copied. Paste it into Excel or Sheets.'),
  csvDl:()=>download(`deal-desk-${iso(now())}.csv`,csvOut(),'text/csv'),
  csvParse:()=>{ui.importRows=mapCSV(document.getElementById('csvTxt').value)||{err:'No rows found. Include the header row.'};const t=document.getElementById('csvTxt').value;renderDrawer();document.getElementById('csvTxt').value=t},
  csvImport:()=>{const R=ui.importRows;if(!R||!R.rows)return;closeDrawer();act(`Imported ${R.rows.length} deals into Intake`,()=>{R.rows.forEach(x=>{const d=newDeal({...x,code:x.code||nextCode()});state.deals.push(d)})},true);ui.tab='board';renderAll(true)}
};
function logEsc(d){act(null,()=>{openSegs(d).forEach(s=>{const lv=escLevel(segRatio(d,s));if(lv)d.escal.push({stage:s.stage,level:lv,at:now()})})});ui._keepScroll=true;renderDrawer()}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=H[t.dataset.act];if(f){if(t.tagName==='BUTTON'||t.tagName==='TR'||t.id==='scrim')e.preventDefault();f(t.dataset.id)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lq'){ui.q=t.value;document.getElementById('lbody').innerHTML=ledgerRows()}
  else if(t.id==='notes'){const d=byId(ui.id);d.notes=t.value;save()}
  else if(t.dataset.esc){const d=byId(ui.id);d.escData=d.escData||{};d.escData[t.dataset.esc]=t.value;save()}
  else if(t.closest&&t.closest('#newform'))updatePreview();
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset||{};
  if(t.id==='lstage'){ui.stageF=t.value;document.getElementById('lbody').innerHTML=ledgerRows();return}
  if(t.closest&&t.closest('#newform')){
    if(t.id==='f-disc'&&+t.value>S().lanes.fastDisc)document.getElementById('t-pricing').checked=true;
    if(t.id==='f-pay'&&+t.value>S().lanes.stdPay)document.getElementById('t-payment').checked=true;
    updatePreview();return}
  if(ds.field){const d=byId(ui.id);const k=ds.field;ui._keepScroll=true;act(null,()=>{if(k==='closeDate')d.closeDate=fromIso(t.value);else d[k]=parseFloat(t.value)||0;if(k==='discount'&&d.discount>S().lanes.fastDisc&&!d.triggers.includes('pricing'))d.triggers.push('pricing');if(k==='payDays'&&d.payDays>S().lanes.stdPay&&!d.triggers.includes('payment'))d.triggers.push('payment');relane(d)});return}
  if(ds.ap){const d=byId(ui.id),a=d.approvals.find(x=>x.id===ds.ap);ui._keepScroll=true;act(null,()=>{a[ds.k]=ds.k==='exp'?fromIso(t.value):t.value});return}
  if(ds.mx){act(null,()=>{S().matrix[ds.mx][ds.k]=ds.k==='sla'?Math.max(.25,parseFloat(t.value)||1):t.value});return}
  if(ds.ln){act('Lane rules updated',()=>{S().lanes[ds.ln]=parseFloat(t.value)||0;state.deals.filter(d=>!isBooked(d)).forEach(d=>relane(d,'Auto: lane rules changed'))});return}
  if(ds.lm){act(null,()=>{S().lanes.mult[ds.lm]=Math.max(.1,parseFloat(t.value)||1)});return}
  if(ds.st){act(null,()=>{S()[ds.st]=ds.st==='triageHrs'?Math.max(1,parseFloat(t.value)||4):t.value});return}
  if(t.id==='restoreFile'&&t.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(t.files[0]);return}
  if(t.id==='csvFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{ui.importRows=mapCSV(String(r.result))||{err:'No rows found.'};renderDrawer()};r.readAsText(t.files[0])}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='newform'){
    const g=id=>document.getElementById(id).value.trim();
    const trs=[...document.querySelectorAll('#newform [name=trig]:checked')].map(x=>x.value);
    const intake=INTAKE.map((_,i)=>document.getElementById('i-'+i).checked);
    const d=newDeal({code:g('f-code'),account:g('f-acct'),rep:g('f-rep'),value:parseFloat(g('f-val'))||0,closeDate:fromIso(g('f-close')),discount:parseFloat(g('f-disc'))||0,payDays:parseInt(g('f-pay'),10)||S().lanes.stdPay,parallel:g('f-par')==='1',triggers:trs,intake,notes:g('f-notes'),ack:true});
    act(`${d.code} created${d.clockStart?'. Clock started.':'. Clock starts when intake is complete.'}`,()=>state.deals.push(d));openDrawer('deal',d.id);
  }else if(e.target.id==='libform'){
    const g=id=>document.getElementById(id).value.trim();const name=g('lb-name');if(!name){toast('Name the exception');return}
    act('Play saved',()=>{let L=ui.libId&&state.library.find(x=>x.id===ui.libId);if(!L){L={id:uid()};state.library.push(L)}Object.assign(L,{name,dept:g('lb-dept'),preferred:g('lb-pref'),fallback:g('lb-fb'),pushback:g('lb-push'),escalate:g('lb-esc'),standard:document.getElementById('lb-std').checked});delete L.sample});closeDrawer();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.mode){closeDrawer();return}
  const map={excIn:'excAdd',newApprLabel:'addAppr',laneReason:'laneGo'};
  if(e.key==='Enter'&&map[e.target.id]){e.preventDefault();H[map[e.target.id]]();return}
  if(e.key==='Enter'&&/^g-/.test(e.target.id)){e.preventDefault();H.guardGo(ui.guard);return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openDrawer('new');return}
  const n=parseInt(e.key,10);if(n>=1&&n<=TABS.length&&!ui.mode)H.tab(TABS[n-1][0]);
});

load();save();
document.getElementById('today').textContent='Desk open · '+new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
renderAll(true);
setInterval(()=>{if(!ui.mode){MED=null;renderKPIs(false);renderTabs();if(['today','board','radar'].includes(ui.tab))renderView(false)}},60000);
if(!onClaude&&location.protocol.startsWith('http')){
  try{const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
window.__ddcc={state:()=>state,H};
})();
